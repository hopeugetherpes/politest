spring.application.name=politest-backend

app.frontend-origins=http://localhost:5173,http://127.0.0.1:5173,https://politest.anatole.co

# Os testes de dominio chamam /api/** sem Origin (MockMvc nao simula navegador).
# OriginEnforcementTest liga a flag explicitamente via @TestPropertySource.
app.origin-enforcement=false

# Os testes de dominio fazem muitas chamadas do mesmo IP; RateLimitFilterTest liga o limite explicitamente.
app.rate-limit.enabled=false
app.access-sample-every=0
