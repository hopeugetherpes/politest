services:
  - type: web
    name: politest-backend
    runtime: docker
    rootDir: backend
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://politest.anatole.co
      - key: API_ORIGIN_ENFORCEMENT
        value: "true"
